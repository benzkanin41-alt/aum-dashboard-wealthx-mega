name: Refresh canonical Sites AUM and AUA

on:
  workflow_dispatch:
  schedule:
    # 09:00 Asia/Bangkok = 02:00 UTC. GitHub may start scheduled jobs later when queues are busy.
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: ltmh-wealthx-sites-refresh
  cancel-in-progress: false

env:
  SITES_BASE_URL: https://ltmh-wealthx-aum-aua.benzkanin41.chatgpt.site

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scheduler client
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Refresh AUM, official AUA, model, and snapshot
        run: node scripts/run-sites-refresh.js

      - name: Verify canonical dashboard
        run: |
          curl --fail --silent --show-error "$SITES_BASE_URL/api/dashboard" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.appId!=="aum-dashboard"||!x.dataVersion||!x.model?.id)process.exit(1);console.log(JSON.stringify({dataVersion:x.dataVersion,modelVersion:x.model.id,generatedAt:x.generatedAt}))})'
