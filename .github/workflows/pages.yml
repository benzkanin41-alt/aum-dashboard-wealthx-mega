name: Refresh canonical Sites and publish AUM Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "daily skips a completed refresh after 09:00 Bangkok; manual always requests an update"
        type: choice
        options:
          - manual
          - daily
        default: manual
  schedule:
    # Keep the original 09:00 target until the external scheduler is verified.
    # Daily mode also deduplicates a delayed GitHub fallback after cron-job.org.
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: ltmh-wealthx-sites-refresh
  cancel-in-progress: false

env:
  SITES_BASE_URL: https://ltmh-wealthx-aum-aua.benzkanin41.chatgpt.site

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout scheduler client
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Refresh AUM, official AUA, model, and snapshot
        env:
          REFRESH_MODE: ${{ github.event_name == 'schedule' && 'daily' || inputs.mode || 'manual' }}
        run: node scripts/run-sites-refresh.js

      - name: Verify canonical dashboard
        run: |
          curl --fail --silent --show-error "$SITES_BASE_URL/api/dashboard" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.appId!=="aum-dashboard"||!x.dataVersion||!x.model?.id)process.exit(1);console.log(JSON.stringify({dataVersion:x.dataVersion,modelVersion:x.model.id,generatedAt:x.generatedAt}))})'

  build:
    needs: refresh
    # A skipped push refresh is intentional; daily/manual refresh failures block publication.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.refresh.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the shared React application
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked build dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build the existing dashboard for GitHub Pages
        run: npm run build:pages

      - name: Upload only the static Pages build
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy the static dashboard
        id: deployment
        uses: actions/deploy-pages@v5
